spring:
  application:
    name: course-platform
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/course_platform}
    username: ${DB_USERNAME:course_platform}
    password: ${DB_PASSWORD:course_platform_dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:course_platform}
    password: ${RABBITMQ_PASSWORD:course_platform_dev}
    publisher-confirm-type: CORRELATED
    publisher-returns: true

app:
  outbox:
    scheduling-enabled: ${OUTBOX_SCHEDULING_ENABLED:false}
    fixed-delay: ${OUTBOX_FIXED_DELAY:PT1S}
  security:
    jwt-secret: ${JWT_SECRET:course-platform-development-secret-change-me}
    token-ttl: 1h
