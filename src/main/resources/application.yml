spring:
  application:
    name: course-platform
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/course_platform}
    username: ${DB_USERNAME:course_platform}
    password: ${DB_PASSWORD:course_platform_dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:course_platform}
    password: ${RABBITMQ_PASSWORD:course_platform_dev}
    publisher-confirm-type: CORRELATED
    publisher-returns: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cache:
    type: redis
  ai:
    mcp:
      server:
        name: course-platform
        version: 1.0.0
        protocol: STREAMABLE
        type: SYNC
        annotation-scanner:
          enabled: true

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - prometheus
          - metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_PROBABILITY:1.0}
  otlp:
    metrics:
      export:
        enabled: false
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  metrics:
    tags:
      application: ${spring.application.name}

app:
  payment:
    enrollment-created-outcome: ${PAYMENT_ENROLLMENT_CREATED_OUTCOME:CONFIRM}
  outbox:
    scheduling-enabled: ${OUTBOX_SCHEDULING_ENABLED:false}
    fixed-delay: ${OUTBOX_FIXED_DELAY:PT1S}
  security:
    jwt-secret: ${JWT_SECRET:course-platform-development-secret-change-me}
    token-ttl: 1h
