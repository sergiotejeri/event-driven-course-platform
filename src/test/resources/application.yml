spring:
  ai:
    mcp:
      server:
        enabled: false
  cache:
    type: none
  jpa:
    open-in-view: false
  rabbitmq:
    publisher-confirm-type: CORRELATED
    publisher-returns: true

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - prometheus
          - metrics
  endpoint:
    health:
      probes:
        enabled: true

app:
  payment:
    enrollment-created-outcome: CONFIRM
  outbox:
    scheduling-enabled: false
    fixed-delay: PT1S
  rate-limit:
    enabled: false
  security:
    jwt-secret: course-platform-development-secret-change-me
    token-ttl: 1h
